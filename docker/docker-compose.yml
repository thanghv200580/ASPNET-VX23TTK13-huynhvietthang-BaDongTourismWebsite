version: "3.8"

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: badong_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - badong_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStr0ngP@ssw0rd!' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ASP.NET Web Application
  web:
    build:
      context: ../src/BaDongTourismWebsite
      dockerfile: Dockerfile
    container_name: badong_web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${APP_PORT}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DB};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - badong_network
    volumes:
      - ../src/BaDongTourismWebsite:/app/src
      - /app/src/bin
      - /app/src/obj

volumes:
  sqlserver_data:
    driver: local

networks:
  badong_network:
    driver: bridge
